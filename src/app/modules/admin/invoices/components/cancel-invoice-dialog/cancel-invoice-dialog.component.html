<div class="admin-dialog" *ngIf="open">
  <div class="admin-dialog__backdrop" (click)="cancel()"></div>

  <div
    #panel
    class="admin-dialog__panel admin-dialog__panel--sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cancel-invoice-dialog-title"
    tabindex="-1"
    (keydown.escape)="cancel()"
    (keydown.tab)="onTab($event)"
  >
    <header class="admin-dialog__header" [class.admin-dialog__header--scrolled]="scrolled()">
      <h2 id="cancel-invoice-dialog-title" class="admin-dialog__title">
        {{ 'admin.invoices.cancelDialog.title' | translate }}
      </h2>
      <button type="button" class="admin-dialog__close" (click)="cancel()" [attr.aria-label]="'common.close' | translate">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </header>

    <div class="admin-dialog__body" (scroll)="onBodyScroll($event)">
      <div class="admin-dialog__warning">
        <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
        <span>{{ 'admin.invoices.cancelDialog.warning' | translate }}</span>
      </div>

      <div class="admin-dialog__inline-error" *ngIf="errorMessage()">
        <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
        <span>{{ errorMessage() }}</span>
      </div>

      <label class="admin-dialog__field-label" for="invoice-cancel-reason">
        {{ 'admin.invoices.cancelDialog.reasonLabel' | translate }}
      </label>
      <textarea
        id="invoice-cancel-reason"
        class="admin-dialog__textarea"
        rows="3"
        required
        [maxLength]="reasonMaxLength"
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
        [placeholder]="'admin.invoices.cancelDialog.reasonPlaceholder' | translate"
      ></textarea>
      <span class="admin-dialog__counter">{{ reason().length }}/{{ reasonMaxLength }}</span>
    </div>

    <footer class="admin-dialog__footer" [class.admin-dialog__footer--scrolled]="scrolled()">
      <button type="button" class="admin-dialog__cancel" [disabled]="saving()" (click)="cancel()">
        {{ 'admin.invoices.cancelDialog.keepInvoice' | translate }}
      </button>
      <button
        type="button"
        class="admin-dialog__submit admin-dialog__submit--stop"
        [disabled]="saving() || !canSubmit"
        (click)="submit()"
      >
        <i class="pi" [ngClass]="saving() ? 'pi-spin pi-spinner' : 'pi-ban'" aria-hidden="true"></i>
        {{ 'admin.invoices.cancelDialog.submit' | translate }}
      </button>
    </footer>
  </div>
</div>

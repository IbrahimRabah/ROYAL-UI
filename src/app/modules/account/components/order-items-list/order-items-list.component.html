<div class="order-items-list">
  <div class="order-items-list__row" *ngFor="let item of items">
    <a class="order-items-list__thumb" [routerLink]="['/products', item.productSlug]">
      <img [src]="item.imageUrl" [alt]="item.name" loading="lazy" decoding="async" />
    </a>
    <div class="order-items-list__info">
      <a class="order-items-list__name" [routerLink]="['/products', item.productSlug]">{{ item.name }}</a>
      <span class="order-items-list__variant">{{ item.variantSummary }}</span>
      <span class="order-items-list__qty">{{ 'checkout.summary.qty' | translate: { count: item.quantity } }}</span>
      <span class="order-items-list__sale" *ngIf="item.promotionName">
        {{ 'sale.appliedOnOrder' | translate: { name: item.promotionName } }}
        <s *ngIf="item.listUnitPrice"><app-vl-price [minPrice]="item.listUnitPrice"></app-vl-price></s>
      </span>
    </div>
    <div class="order-items-list__total"><app-vl-price [minPrice]="item.lineTotal"></app-vl-price></div>
  </div>
</div>

<ng-container *ngIf="!loading(); else loadingTpl">
  <ng-container *ngIf="product() as p; else notFoundTpl">
    <section class="pdp section">
      <div class="container-vl pdp__grid">
        <app-product-gallery
          [images]="galleryImages()"
          [activeImageId]="activeGalleryImageId()"
          [productName]="p.name"
          (displayedImageIdChange)="onDisplayedImageChange($event)"
        ></app-product-gallery>

        <div class="pdp__details">
          <span *ngIf="p.newArrival" class="pdp__badge">{{ 'product.new' | translate }}</span>

          <h1 class="pdp__name">{{ p.name }}</h1>

          <p class="pdp__meta">
            <span>{{ categoryName() }}</span>
            <span class="pdp__meta-sep" aria-hidden="true">&bull;</span>
            <span>{{ selectedVariant()?.sku }}</span>
          </p>

          <app-product-price-block *ngIf="readyMade(); else priceOnRequest" [price]="displayPrice()"></app-product-price-block>
          <ng-template #priceOnRequest>
            <p class="pdp__price-on-request">{{ 'product.priceOnRequest' | translate }}</p>
          </ng-template>

          <p class="pdp__short-desc">{{ p.shortDescription }}</p>

          <app-variant-selector
            *ngIf="readyMade() && colorGroup() as group"
            [colorGroup]="group"
            [selectedValueId]="isPosterDisplayed() ? null : selectedValueId()"
            (selectedValueIdChange)="selectValue($event)"
          ></app-variant-selector>

          <app-add-to-cart-box
            [quoteProductId]="readyMade() ? null : p.id"
            [quoteType]="quoteType()"
            [quoteLabelKey]="quoteLabelKey()"
            [disabled]="!inStock()"
            [loading]="addingToCart()"
            [success]="justAddedToCart()"
            (addToCart)="addToCart()"
          ></app-add-to-cart-box>

          <app-vl-feature-strip class="pdp__features-wrap"></app-vl-feature-strip>
        </div>
      </div>
    </section>

    <section class="pdp__description section">
      <div class="container-vl pdp__description-inner">
        <app-product-tabs
          class="pdp__description-copy"
          [description]="p.description"
          [specifications]="p.specifications"
        ></app-product-tabs>

        <img
          *ngIf="descriptionImage() as image"
          class="pdp__description-image"
          [src]="image.url"
          [alt]="image.alt || p.name"
          loading="lazy"
          decoding="async"
        />
      </div>
    </section>

    <app-related-products [products]="relatedProducts()"></app-related-products>
  </ng-container>
</ng-container>

<ng-template #loadingTpl>
  <div class="pdp__loading container-vl section">
    <div class="pdp__loading-gallery"></div>
    <div class="pdp__loading-details">
      <div class="pdp__loading-line pdp__loading-line--lg"></div>
      <div class="pdp__loading-line"></div>
      <div class="pdp__loading-line pdp__loading-line--sm"></div>
    </div>
  </div>
</ng-template>

<ng-template #notFoundTpl>
  <p class="pdp__not-found container-vl section">{{ 'product.notFound' | translate }}</p>
</ng-template>

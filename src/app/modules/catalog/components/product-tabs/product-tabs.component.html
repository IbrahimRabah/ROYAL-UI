<div class="ptabs">
  <section class="ptabs__section" *ngIf="description">
    <h2 class="ptabs__title">{{ 'product.description' | translate }}</h2>
    <p class="ptabs__description-text">{{ description }}</p>
  </section>

  <section class="ptabs__section" *ngIf="specifications.length">
    <h2 class="ptabs__title">{{ 'product.specifications' | translate }}</h2>
    <app-product-specs-table [specifications]="specifications"></app-product-specs-table>
  </section>
</div>

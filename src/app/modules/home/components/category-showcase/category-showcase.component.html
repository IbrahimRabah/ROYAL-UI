<section class="category-showcase section">
  <div class="container-vl">
    <h2 class="category-showcase__title">{{ 'home.categories.title' | translate }}</h2>

    <div class="category-showcase__grid">
      <a
        *ngFor="let category of categories"
        class="category-showcase__card"
        [class.category-showcase__card--plain]="!hasImage(category)"
        routerLink="/products"
        [queryParams]="{ categoryId: category.id }"
      >
        <img
          *ngIf="hasImage(category)"
          class="category-showcase__image"
          [src]="category.imageUrl"
          [alt]="category.name"
          loading="lazy"
          decoding="async"
          (error)="onImageError(category.id)"
        />
        <span *ngIf="hasImage(category)" class="category-showcase__overlay"></span>
        <span class="category-showcase__name">{{ category.name }}</span>
      </a>
    </div>
  </div>
</section>

<section class="category-showcase section">
  <div class="container-vl">
    <h2 class="category-showcase__title">{{ 'home.categories.title' | translate }}</h2>

    <div class="category-showcase__grid">
      <a
        *ngFor="let tile of tiles; trackBy: trackByIndex"
        class="category-showcase__tile"
        [class.category-showcase__tile--plain]="!tile.isAll && !hasImage(tile)"
        [class.category-showcase__tile--all]="tile.isAll"
        routerLink="/products"
        [queryParams]="tile.id !== null ? { categoryId: tile.id } : null"
      >
        <img
          *ngIf="hasImage(tile)"
          class="category-showcase__image"
          [src]="tile.imageUrl"
          alt=""
          loading="lazy"
          decoding="async"
          (error)="markBroken(tile)"
        />
        <span class="category-showcase__initial" *ngIf="!tile.isAll && !hasImage(tile)" aria-hidden="true">{{ initial(tile) }}</span>
        <span class="category-showcase__scrim" *ngIf="!tile.isAll" aria-hidden="true"></span>

        <span class="category-showcase__content">
          <span class="category-showcase__name">{{ tile.isAll ? ('home.categories.all' | translate) : tile.name }}</span>
          <span class="category-showcase__rule" aria-hidden="true"></span>
          <span class="category-showcase__description" *ngIf="tile.description">{{ tile.description }}</span>
          <span class="category-showcase__browse">{{ 'home.categories.browse' | translate }}</span>
        </span>
      </a>
    </div>
  </div>
</section>

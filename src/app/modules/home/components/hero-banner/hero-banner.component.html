<section class="hero-banner">
  <!-- LCP image (about 215KB, 3:1): loaded eagerly at high priority, the opposite of every other image on the page. -->
  <img
    class="hero-banner__image"
    src="assets/images/home/new-banner.jpg"
    width="2172"
    height="724"
    [alt]="'home.hero.imageAlt' | translate"
    fetchpriority="high"
    loading="eager"
  />

  <!-- The page's one H1 (there is no text heading in the picture). Visually hidden; screen readers and search
       engines read it. -->
  <h1 class="visually-hidden">{{ 'home.hero.title' | translate }}</h1>

  <div class="hero-banner__content">
    <p class="hero-banner__headline" aria-hidden="true">{{ 'footer.hero.tagline' | translate }}</p>
    <p class="hero-banner__tagline">{{ 'home.hero.tagline' | translate }}</p>
    <a
      routerLink="/products"
      pButton
      pRipple
      [label]="'home.hero.cta' | translate"
      class="hero-banner__cta"
    ></a>
  </div>
</section>

<section class="hero-banner">
  <!-- LCP image: a dedicated portrait crop below md (composed for phone aspect ratios,
       not just the desktop artwork squeezed narrower), then webp with a png fallback
       above that — loaded eagerly at high priority, the opposite of every other image
       on the page, which is lazy. -->
  <picture>
    <source media="(max-width: 767px)" srcset="assets/images/home/hero_mobile.png" />
    <source srcset="assets/images/home/hero.webp" type="image/webp" />
    <img
      class="hero-banner__image"
      src="assets/images/home/hero.png"
      [alt]="'home.hero.imageAlt' | translate"
      fetchpriority="high"
      loading="eager"
    />
  </picture>

  <!--
    Sits directly under the ROYAL IRON wordmark that's baked into the image itself,
    so its position is pinned to fixed pixels of that artwork, not to reading direction —
    it must NOT flip with RTL/LTR like the rest of the site. `left` + translateX(-50%) is
    used deliberately here instead of the usual inset-inline-start/logical properties.
  -->
  <div class="hero-banner__content">
    <p class="hero-banner__tagline">{{ 'home.hero.tagline' | translate }}</p>
    <a
      routerLink="/products"
      pButton
      pRipple
      [label]="'home.hero.cta' | translate"
      class="hero-banner__cta"
    ></a>
  </div>
</section>

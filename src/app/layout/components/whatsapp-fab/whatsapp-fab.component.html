<a
  *ngIf="href() as link"
  class="whatsapp-fab"
  [class.whatsapp-fab--raised]="raised()"
  [class.whatsapp-fab--raised-mobile]="raisedMobile()"
  [href]="link"
  target="_blank"
  rel="noopener"
  (click)="onClick()"
  [attr.aria-label]="'whatsapp.label' | translate"
>
  <i class="pi pi-whatsapp" aria-hidden="true"></i>
</a>

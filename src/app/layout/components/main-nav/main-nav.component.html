<nav class="main-nav" [attr.aria-label]="'common.menu' | translate" (focusout)="onFocusOut($event)">
  <a routerLink="/" routerLinkActive="main-nav__link--active" [routerLinkActiveOptions]="{ exact: true }" class="main-nav__link">
    {{ 'common.home' | translate }}
  </a>

  <!-- Products: the full catalogue mega-menu -->
  <div class="main-nav__item" (mouseenter)="hoverOpen('products')" (mouseleave)="hoverClose('products')">
    <button
      #productsBtn
      type="button"
      class="main-nav__link main-nav__trigger"
      [class.main-nav__link--active]="isOpen('products')"
      [attr.aria-expanded]="isOpen('products')"
      aria-haspopup="true"
      aria-controls="main-nav-products"
      (click)="toggle('products')"
      (keydown.arrowdown)="openWithKeyboard($event, 'products')"
    >
      <span>{{ 'header.nav.products' | translate }}</span>
      <i class="pi pi-angle-down main-nav__chevron" aria-hidden="true"></i>
    </button>

    <div id="main-nav-products" class="main-nav__mega" [class.main-nav__mega--open]="isOpen('products')">
      <div class="container-vl main-nav__mega-inner">
        <div class="main-nav__mega-grid">
          <div class="main-nav__col" *ngFor="let category of categories">
            <a
              class="main-nav__col-title"
              routerLink="/products"
              [queryParams]="{ categoryId: category.id }"
              (click)="closeAll()"
            >{{ category.name }}</a>
            <ul class="main-nav__col-list" *ngIf="category.children.length">
              <li *ngFor="let child of category.children">
                <a
                  class="main-nav__child"
                  routerLink="/products"
                  [queryParams]="{ categoryId: child.id }"
                  (click)="closeAll()"
                >{{ child.name }}</a>
              </li>
            </ul>
          </div>
        </div>
        <a class="main-nav__all" routerLink="/products" (click)="closeAll()">
          {{ 'common.allProducts' | translate }}
        </a>
      </div>
    </div>
  </div>

  <!-- Architectural Work: a short menu from /portfolio/categories. With no categories it is just a link. -->
  <div
    class="main-nav__item main-nav__item--work"
    *ngIf="workCategories.length; else workLink"
    (mouseenter)="hoverOpen('work')"
    (mouseleave)="hoverClose('work')"
  >
    <button
      #workBtn
      type="button"
      class="main-nav__link main-nav__trigger"
      [class.main-nav__link--active]="isOpen('work')"
      [attr.aria-expanded]="isOpen('work')"
      aria-haspopup="true"
      aria-controls="main-nav-work"
      (click)="toggle('work')"
      (keydown.arrowdown)="openWithKeyboard($event, 'work')"
    >
      <span>{{ 'header.nav.architecturalWork' | translate }}</span>
      <i class="pi pi-angle-down main-nav__chevron" aria-hidden="true"></i>
    </button>

    <div id="main-nav-work" class="main-nav__menu" [class.main-nav__menu--open]="isOpen('work')">
      <ul class="main-nav__menu-list">
        <li *ngFor="let category of workCategories">
          <a
            class="main-nav__menu-link"
            routerLink="/portfolio"
            [queryParams]="{ category: category.slug }"
            (click)="closeAll()"
          >{{ category.name }}</a>
        </li>
      </ul>
      <a class="main-nav__menu-all" routerLink="/portfolio" (click)="closeAll()">
        {{ 'header.nav.allWork' | translate }}
      </a>
    </div>
  </div>

  <ng-template #workLink>
    <a routerLink="/portfolio" routerLinkActive="main-nav__link--active" class="main-nav__link">
      {{ 'header.nav.architecturalWork' | translate }}
    </a>
  </ng-template>
</nav>

<header class="admin-topbar">
  <button
    type="button"
    class="admin-topbar__menu-btn"
    (click)="menuToggle.emit()"
    [attr.aria-label]="'common.menu' | translate"
  >
    <i class="pi pi-bars" aria-hidden="true"></i>
  </button>

  <h1 class="admin-topbar__title">{{ pageTitleKey() | translate }}</h1>

  <div class="admin-topbar__end">
    <app-vl-language-switcher class="admin-topbar__lang"></app-vl-language-switcher>

    <a
      routerLink="/"
      target="_blank"
      rel="noopener"
      class="admin-topbar__view-store"
      [attr.aria-label]="'admin.topbar.viewStore' | translate"
    >
      <i class="pi pi-external-link" aria-hidden="true"></i>
      <span class="admin-topbar__view-store-label">{{ 'admin.topbar.viewStore' | translate }}</span>
    </a>

    <button
      type="button"
      class="admin-topbar__account-trigger"
      (click)="toggleAccountPanel($event)"
      [attr.aria-label]="'admin.topbar.account' | translate"
    >
      <i class="pi pi-user" aria-hidden="true"></i>
      <span class="admin-topbar__account-name">{{ adminName() }}</span>
      <i class="pi pi-angle-down" aria-hidden="true"></i>
    </button>
  </div>
</header>

<p-popover #panel>
  <div class="admin-topbar__account-panel">
    <button
      type="button"
      class="admin-topbar__signout"
      [disabled]="loggingOut()"
      (click)="logout()"
    >
      <i class="pi" [ngClass]="loggingOut() ? 'pi-spin pi-spinner' : 'pi-sign-out'" aria-hidden="true"></i>
      {{ 'admin.topbar.signOut' | translate }}
    </button>
  </div>
</p-popover>

<button
  #trigger
  type="button"
  class="user-menu__trigger"
  aria-haspopup="true"
  [attr.aria-expanded]="open()"
  (click)="toggle($event)"
  [attr.aria-label]="'header.account' | translate"
>
  <i class="pi pi-user" aria-hidden="true"></i>
</button>

<p-popover #panel (onShow)="onShow()" (onHide)="onHide()">
  <div class="user-menu__panel" (click)="onPanelClick($event)">
    <ng-container *ngIf="isLoggedIn(); else guestLinks">
      <a routerLink="/me/profile" class="user-menu__link">
        <i class="pi pi-user" aria-hidden="true"></i>
        {{ 'userMenu.profile' | translate }}
      </a>
      <a routerLink="/me/orders" class="user-menu__link">
        <i class="pi pi-shopping-bag" aria-hidden="true"></i>
        {{ 'userMenu.orders' | translate }}
      </a>
      <a routerLink="/me/addresses" class="user-menu__link">
        <i class="pi pi-map-marker" aria-hidden="true"></i>
        {{ 'userMenu.addresses' | translate }}
      </a>
      <ng-container *ngIf="isAdmin()">
        <hr class="user-menu__divider" />
        <a routerLink="/admin/dashboard" class="user-menu__link">
          <i class="pi pi-shield" aria-hidden="true"></i>
          {{ 'userMenu.admin' | translate }}
        </a>
      </ng-container>
      <hr class="user-menu__divider" />
      <button
        type="button"
        class="user-menu__link user-menu__link--button"
        [disabled]="loggingOut()"
        (click)="logout()"
      >
        <i class="pi" [ngClass]="loggingOut() ? 'pi-spin pi-spinner' : 'pi-sign-out'" aria-hidden="true"></i>
        {{ 'userMenu.logout' | translate }}
      </button>
    </ng-container>

    <ng-template #guestLinks>
      <a routerLink="/auth/login" class="user-menu__link">
        <i class="pi pi-sign-in" aria-hidden="true"></i>
        {{ 'userMenu.login' | translate }}
      </a>
      <a routerLink="/auth/register" class="user-menu__link">
        <i class="pi pi-user-plus" aria-hidden="true"></i>
        {{ 'userMenu.register' | translate }}
      </a>
    </ng-template>
  </div>
</p-popover>
